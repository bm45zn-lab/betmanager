<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetManager</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#080808;--panel:#121212;--panel2:#1b1b1b;--line:#303030;--text:#f5f5f5;--muted:#a1a1aa;--red:#ed2939;--red2:#b91425;--red-soft:rgba(237,41,57,.12);--gold:#e7c878}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -18%,#351014 0%,#151010 27%,#080808 66%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;min-height:100vh}
header{position:relative;overflow:hidden;padding:30px max(22px,calc((100% - 1120px)/2));background:linear-gradient(110deg,rgba(10,10,10,.98),rgba(37,10,14,.96));border-bottom:1px solid rgba(237,41,57,.34);box-shadow:0 14px 42px rgba(0,0,0,.35)}
header:after{content:"";position:absolute;width:320px;height:320px;right:7%;top:-245px;border:1px solid rgba(237,41,57,.22);border-radius:50%;box-shadow:0 0 0 28px rgba(237,41,57,.035),0 0 0 58px rgba(237,41,57,.025);pointer-events:none}
header h1{margin:0;color:#fff;font-size:clamp(27px,4vw,38px);letter-spacing:.09em;font-weight:900}
header h1:first-letter{color:var(--red)}
header p{margin:5px 0 0;color:#b7aeb0;letter-spacing:.025em}
main{max-width:1120px;margin:30px auto;padding:0 20px 56px}
h2{font-size:20px;letter-spacing:-.025em;margin:0 0 18px;display:flex;align-items:center;gap:10px}
h2:before{content:"";display:block;width:4px;height:20px;border-radius:4px;background:var(--red)}
h3{font-size:17px;margin:8px 0}
.card{background:linear-gradient(145deg,rgba(21,21,21,.98),rgba(14,14,14,.99));border:1px solid #303030;padding:23px;border-radius:17px;margin:18px 0;box-shadow:0 16px 38px rgba(0,0,0,.25)}
.card:hover{border-color:#494044}
input,select{width:100%;margin-top:7px;padding:13px 14px;border-radius:10px;border:1px solid #393939;background:#0a0a0a;color:var(--text);font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(237,41,57,.14)}
label{display:block;color:#dedadd;font-size:13px;font-weight:650}
button{padding:12px 17px;border-radius:10px;border:1px solid transparent;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font:inherit;font-weight:750;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s;box-shadow:0 6px 18px rgba(190,20,37,.2);margin:4px 6px 4px 0}
button:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 8px 22px rgba(190,20,37,.28)}
button:active{transform:translateY(0)}
button:disabled{opacity:.55;cursor:wait;transform:none}
#nationsLeagueButton{background:#241619;color:#ffdce0;border-color:#633039;box-shadow:none}
.quick-filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.quick-filters button{margin:0;background:#1b1b1b;color:#e7e2e3;border:1px solid #393234;box-shadow:none;padding:9px 12px;font-size:12px}
.quick-filters button:hover{background:#32171c;border-color:#a82a38;color:#fff}
.quick-filters .filter-heading{width:100%;margin:10px 0 3px;color:#a7a0a2;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
#status{color:var(--muted);font-size:14px;margin:14px 0 0}
.match{padding:18px 8px;border-bottom:1px solid #292929}
.match:last-child{border-bottom:0}
.match>b{font-size:16px;color:#fff}
.match p{margin:5px 0 10px}
.analysis-section{margin:15px 0;padding:18px;background:linear-gradient(145deg,rgba(29,20,21,.76),rgba(18,18,18,.9));border:1px solid rgba(130,53,62,.25);border-radius:13px}
.analysis-section>h3{font-size:17px;margin:0 0 12px}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}
.stat-card{background:linear-gradient(145deg,#202020,#151515);border:1px solid #343434;padding:14px;border-radius:11px;color:#c9c4c5;font-size:13px}
.stat-card strong{display:block;font-size:22px;color:#ff5967;margin-top:4px;line-height:1.25;overflow-wrap:anywhere}
.team-heading{display:flex;align-items:center;gap:11px;margin:14px 0 12px}
.team-heading img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 5px #0005)}
.team-heading h3{font-size:18px}
.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:10px 0;border-bottom:1px solid #292929;overflow-wrap:anywhere}
.comparison-row{grid-template-columns:minmax(120px,1fr) minmax(0,2fr);align-items:start}
.comparison-nested{min-width:0}
.comparison-nested .metric{grid-template-columns:minmax(100px,1fr) minmax(0,1fr);gap:9px;padding:7px 0}
.comparison-nested .metric:last-child{border-bottom:0}
.muted,small{color:var(--muted)}
.prediction{padding:18px;background:linear-gradient(145deg,#251316,#151112);border:1px solid rgba(237,41,57,.3);border-radius:12px;margin:10px 0}
.prediction h3{font-size:25px;color:#ff6875}
.bet-suggestion{margin:15px 0;padding:15px;border:1px solid rgba(237,41,57,.4);border-radius:11px;background:rgba(120,18,31,.13)}
.bet-suggestion strong{display:block;color:#ff6875;font-size:18px;margin:4px 0}
details{margin-top:15px;border-top:1px solid #303030;padding-top:12px}
summary{color:#ff6875;font-weight:700;cursor:pointer;padding:4px 0}
summary:hover{color:#fff}
.green{color:var(--red)}
@media(max-width:600px){header{padding:24px 18px}main{padding:0 13px 38px;margin:18px auto}.card{padding:17px;border-radius:14px}.analysis-section{padding:14px}.comparison-row{grid-template-columns:1fr;gap:3px}.comparison-nested .metric{grid-template-columns:1fr auto}.stat-card strong{font-size:20px}}
</style>
</head>
<body>
<header>
<h1>⚽ BETMANAGER</h1>
<p>Análise inteligente de futebol</p>
</header>
<main>
<div class="card">
<h2>Calendário de jogos</h2>
<div class="grid">
<label>Data inicial<br><input type="date" id="from"></label>
<label>Data final<br><input type="date" id="to"></label>
<select id="league" hidden aria-hidden="true">
<option value="">Todas as competições</option>
</select>
</div>
<br>
<button id="searchButton" type="button">Pesquisar jogos</button>
<div class="quick-filters" aria-label="Atalhos para competições">
  <span class="filter-heading">Ligas nacionais</span>
  <button type="button" data-league-country="Portugal">Portugal</button>
  <button type="button" data-league-country="Spain">Espanha</button>

  <button type="button" data-league-country="England">Inglaterra</button>
  <button type="button" data-league-country="Italy">Itália</button>
  <button type="button" data-league-country="Germany">Alemanha</button>
  <button type="button" data-league-country="Netherlands">Países Baixos</button>
  <button type="button" data-league-country="Belgium">Bélgica</button>
  <button type="button" data-league-country="Scotland">Escócia</button>
  <button type="button" data-league-country="Turkey">Turquia</button>
  <button type="button" data-league-country="Austria">Áustria</button>
  <button type="button" data-league-country="Switzerland">Suíça</button>
  <button type="button" data-league-country="Greece">Grécia</button>
  <button type="button" data-league-country="Denmark">Dinamarca</button>
  <button type="button" data-league-country="Norway">Noruega</button>
  <button type="button" data-league-country="Sweden">Suécia</button>
  <button type="button" data-league-country="Poland">Polónia</button>

<p id="status"><small>Seleciona as datas para começar.</small></p>

<div class="card">
<h2>Jogos encontrados</h2>
<div id="games">À espera da pesquisa...</div>
</div>

<h2>Análise do jogo</h2>
<div id="analysis">Seleciona um jogo para consultar a análise e as estatísticas.</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

// Formata a data no fuso local sem depender de toLocaleDateString.
function localDateInputValue(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}

const today = localDateInputValue();
$("from").value = today;
$("to").value = today;

let leagues = [];

async function api(path) {
  const response = await fetch(path, { cache: "no-store" });
  const text = await response.text();
  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    throw new Error("O servidor devolveu uma resposta inválida (" + response.status + ").");
  }

  if (!response.ok) {
    const detail = data.details ? ": " + JSON.stringify(data.details) : "";
    throw new Error((data.error || "Erro HTTP " + response.status) + detail);
  }

  return data;
}

function renderLeagueOptions() {
  const select = $("league");
  const previousValue = select.value;
  const filtered = leagues;

  select.replaceChildren();
  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "Todas as competições";
  select.appendChild(allOption);

  filtered.forEach(league => {
    const option = document.createElement("option");
    option.value = String(league.id);
    option.dataset.season = String(league.season || 2026);
    option.textContent = (league.name || "Competição") + " — " + (league.country || "");
    select.appendChild(option);
  });

  if (filtered.some(league => String(league.id) === previousValue)) {
    select.value = previousValue;
  }
}

async function loadLeagues() {
  const select = $("league");
  select.innerHTML = '<option value="">A carregar ligas...</option>';

  try {
    // Carrega a época atual e a anterior para incluir provas bienais,
    // como o Mundial de Clubes, que pode não ter edição na época atual.
    const [currentData, previousData] = await Promise.all([
      api("/api/leagues?season=2026"),
      api("/api/leagues?season=2025")
    ]);
    const currentLeagues = Array.isArray(currentData.results) ? currentData.results : [];
    // Mantém as provas internacionais da época anterior: algumas competições
    // (por exemplo, o Mundial de Clubes) não têm edição todos os anos.
    const previousInternational = (Array.isArray(previousData.results) ? previousData.results : [])
      .filter(item => /champions league|europa league|club world cup|nations league/i.test(item.name || ""));
    const merged = [...currentLeagues, ...previousInternational];
    const unique = new Map();
    merged.forEach(item => unique.set(String(item.id) + "-" + String(item.season), item));
    leagues = [...unique.values()];
    renderLeagueOptions();
    if (!leagues.length) {
      $("status").textContent = "Não foram encontradas competições para a época selecionada.";
    }
  } catch (error) {
    select.innerHTML = '<option value="">Ligas indisponíveis</option>';
    $("status").textContent = "Não foi possível carregar as competições: " + error.message;
  }
}

function normalizeLeagueText(value) {
  return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("pt-PT");
}

async function selectQuickLeague(button) {
  if (!leagues.length) {
    $("status").textContent = "As competições ainda estão a carregar. Tenta novamente dentro de momentos.";
    return;
  }

  const country = button.dataset.leagueCountry;
  const leagueName = button.dataset.leagueName;
  const normalize = value => normalizeLeagueText(value)
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
  let matches = leagues.filter(item => {
    if (country) return normalize(item.country) === normalize(country);
    const actualName = normalize(item.name);
    const requestedName = normalize(leagueName);
    return requestedName && actualName.includes(requestedName);
  });
  // Quando a mesma prova existe em duas épocas, escolhe a edição mais recente.
  matches.sort((a, b) => Number(b.season || 0) - Number(a.season || 0));

  if (!matches.length) {
    $("status").textContent = "A competição selecionada não está disponível na época carregada pela API.";
    return;
  }

  // Se a API devolver mais do que uma competição para o país, priorizar a primeira divisão.
  if (country) {
    const preferred = matches.find(item => /premier league|primeira liga|la liga|ligue 1|serie a|bundesliga/i.test(item.name));
    if (preferred) matches = [preferred];
  }

  renderLeagueOptions();
  $("league").value = String(matches[0].id);
  await loadFixtures();
}

async function loadFixtures() {
  const from = $("from").value;
  const to = $("to").value;
  const select = $("league");
  const league = select.value;
  const season = select.selectedOptions[0]?.dataset.season;
  const button = $("searchButton");

  if (!from || !to || from > to) {
    $("status").textContent = "Verifica as datas: a data inicial deve ser anterior ou igual à data final.";
    return;
  }

  button.disabled = true;
  button.textContent = "A pesquisar...";
  $("status").textContent = "A consultar jogos...";
  $("games").textContent = "A carregar jogos...";

  try {
    const query = new URLSearchParams({ from, to });
    if (league) {
      query.set("league", league);
      query.set("season", season || "2026");
    }

    const data = await api("/api/fixtures?" + query.toString());
    const games = Array.isArray(data.results) ? data.results : [];

    $("status").textContent = games.length + " jogos encontrados";
    $("games").innerHTML = games.length
      ? games.map(game => {
          const fixtureId = Number(game.fixture?.id);
          const home = game.teams?.home?.name || "Equipa da casa";
          const away = game.teams?.away?.name || "Equipa visitante";
          const leagueName = game.league?.name || "Competição";
          const date = game.fixture?.date ? new Date(game.fixture.date).toLocaleString("pt-PT") : "Data indisponível";
          return '<div class="match"><b>' + home + " – " + away + '</b>' +
            "<p><small>" + leagueName + " · " + date + "</small></p>" +
            (Number.isFinite(fixtureId) ? '<button type="button" onclick="analyse(' + fixtureId + ')">Analisar jogo</button>' : "") +
            "</div>";
        }).join("")
      : "Não foram encontrados jogos para estas datas.";
  } catch (error) {
    $("status").textContent = "Erro ao pesquisar: " + error.message;
    $("games").textContent = "Não foi possível carregar os jogos. Confirma a ligação e tenta novamente.";
  } finally {
    button.disabled = false;
    button.textContent = "Pesquisar jogos";
  }
}

function safeText(value) {
  return String(value ?? "—").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function statValue(value) {
  if (value === null || value === undefined || value === "") return "—";
  return typeof value === "object" ? JSON.stringify(value) : String(value);
}

function renderTeamStatistics(team) {
  const stats = Array.isArray(team.statistics) ? team.statistics : [];
  const possession = stats.find(item => item.type === "Ball Possession");
  const shots = stats.find(item => item.type === "Total Shots");
  const shotsOn = stats.find(item => item.type === "Shots on Goal");
  const corners = stats.find(item => item.type === "Corner Kicks");
  const fouls = stats.find(item => item.type === "Fouls");
  const cards = stats.find(item => item.type === "Yellow Cards");
  const keyStats = [possession, shots, shotsOn, corners, fouls, cards].filter(Boolean);

  return '<div class="analysis-section">' +
    '<div class="team-heading">' +
    (team.team?.logo ? '<img src="' + safeText(team.team.logo) + '" alt="">' : '') +
    '<h3>' + safeText(team.team?.name || "Equipa") + '</h3></div>' +
    (keyStats.length
      ? '<div class="analysis-grid">' + keyStats.map(item =>
          '<div class="stat-card"><span class="muted">' + safeText(statisticLabel(item.type)) +
          '</span><strong>' + safeText(statValue(item.value)) + '</strong></div>'
        ).join("") + '</div>'
      : '<p class="muted">Ainda não existem estatísticas disponíveis para esta equipa.</p>') +
    '<details><summary>Ver todas as estatísticas</summary>' +
    (stats.length ? stats.map(item =>
      '<div class="metric"><span>' + safeText(statisticLabel(item.type)) + '</span><b>' +
      safeText(statValue(item.value)) + '</b></div>'
    ).join("") : '<p class="muted">Sem dados.</p>') +
    '</details></div>';
}

function comparisonLabel(value) {
  const labels = {
    form: "Forma recente",
    att: "Ataque",
    attack: "Ataque",
    def: "Defesa",
    defence: "Defesa",
    defense: "Defesa",
    poisson: "Posse de Bola",
    poisson_distribution: "Posse de Bola",
    h2h: "Confrontos diretos",
    goals: "Golos",
    total: "Total",
    home: "Equipa da casa",
    away: "Equipa visitante",
    last_5: "Últimos cinco jogos",
    last_10: "Últimos dez jogos",
    played: "Jogos disputados",
    wins: "Vitórias",
    draws: "Empates",
    loses: "Derrotas",
    scored: "Golos marcados",
    conceded: "Golos sofridos",
    clean_sheet: "Jogos sem sofrer golos",
    failed_to_score: "Jogos sem marcar",
    avg: "Média",
    average: "Média",
    under: "Menos de",
    over: "Mais de",
    btts: "Ambas as equipas marcam"
  };
  const key = String(value).toLocaleLowerCase("pt-PT").trim().replace(/[ -]/g, "_");
  if (labels[key]) return labels[key];
  return String(value).replace(/_/g, " ").replace(/\\b\\w/g, char => char.toLocaleUpperCase("pt-PT"));
}

function statisticLabel(value) {
  const labels = {
    "Ball Possession": "Posse de bola",
    "Total Shots": "Total de remates",
    "Shots on Goal": "Remates à baliza",
    "Shots off Goal": "Remates ao lado",
    "Blocked Shots": "Remates bloqueados",
    "Corner Kicks": "Pontapés de canto",
    "Fouls": "Faltas",
    "Yellow Cards": "Cartões amarelos",
    "Red Cards": "Cartões vermelhos",
    "Goalkeeper Saves": "Defesas do guarda-redes",
    "Total Passes": "Total de passes",
    "Passes Accurate": "Passes certos",
    "Passes %": "Precisão de passe",
    "expected_goals": "Golos esperados",
    "goals_prevented": "Golos evitados"
  };
  return labels[value] || comparisonLabel(value);
}

function renderComparisonValue(value) {
  if (value === null || value === undefined || value === "") {
    return '<span class="muted">—</span>';
  }

  if (Array.isArray(value)) {
    if (!value.length) return '<span class="muted">Sem dados</span>';
    return '<div class="comparison-nested">' +
      value.map((entry, index) =>
        '<div class="metric"><span>' + (index + 1) + '</span>' +
        '<div>' + renderComparisonValue(entry) + '</div></div>'
      ).join("") + '</div>';
  }

  if (typeof value === "object") {
    const entries = Object.entries(value);
    if (!entries.length) return '<span class="muted">Sem dados</span>';
    return '<div class="comparison-nested">' +
      entries.map(([key, entry]) =>
        '<div class="metric"><span>' + safeText(comparisonLabel(key)) + '</span>' +
        '<div>' + renderComparisonValue(entry) + '</div></div>'
      ).join("") + '</div>';
  }

  return safeText(String(value));
}

function renderPredictions(data) {
  const results = Array.isArray(data) ? data : (Array.isArray(data?.results) ? data.results : []);
  const item = results[0] || null;
  if (!item) {
    const message = data?.message || "Ainda não existem dados suficientes para calcular uma previsão deste jogo.";
    return '<p class="muted">' + safeText(message) + '</p>';
  }

  const prediction = item.predictions || {};
  const winner = prediction.winner?.name || "Sem favorito definido";
  const advice = prediction.advice || "Sem recomendação disponível.";
  const percent = prediction.percent || {};
  const teams = item.teams || {};
  const comparison = item.comparison || {};
  const suggestion = item.betManagerSuggestion || null;
  const fixtureId = item.fixture?.id;
  const predictedHomeGoals = prediction.goals?.home ?? item.score?.home;
  const predictedAwayGoals = prediction.goals?.away ?? item.score?.away;
  const hasScore = predictedHomeGoals !== null && predictedHomeGoals !== undefined &&
    predictedAwayGoals !== null && predictedAwayGoals !== undefined &&
    String(predictedHomeGoals).trim() !== "" && String(predictedAwayGoals).trim() !== "";

  return '<div class="prediction"><p class="muted">Resultado mais provável</p>' +
    (hasScore
      ? '<h3>' + safeText(predictedHomeGoals) + ' – ' + safeText(predictedAwayGoals) + '</h3>'
      : '<h3>' + safeText(winner) + '</h3>') +
    '<p>' + safeText(advice) + '</p>' +
    (suggestion
      ? '<div class="bet-suggestion"><span class="muted">Aposta sugerida</span><strong>' +
        safeText(suggestion.market || "Sem aposta recomendada") + '</strong>' +
        (suggestion.probability !== undefined ? '<span>Probabilidade estimada: ' + safeText(suggestion.probability) + '%</span><br>' : '') +
        '<small>' + safeText(suggestion.reason || "Baseada nas probabilidades estimadas.") + '</small></div>'
      : '<div class="bet-suggestion"><span class="muted">Aposta sugerida</span><strong>Sem aposta recomendada</strong><small>Não existem dados suficientes para indicar um mercado.</small></div>') +
    '<p class="muted">Favorito: ' + safeText(winner) + '</p>' +
    (fixtureId ? '<p class="muted">Previsão para o jogo #' + safeText(fixtureId) + '</p>' : '') +
    '<div class="analysis-grid">' +
    '<div class="stat-card">Casa<strong>' + safeText(percent.home || "—") + '</strong></div>' +
    '<div class="stat-card">Empate<strong>' + safeText(percent.draw || "—") + '</strong></div>' +
    '<div class="stat-card">Fora<strong>' + safeText(percent.away || "—") + '</strong></div>' +
    '</div></div>' +
    '<details><summary>Comparação das equipas</summary>' +
    (Object.keys(comparison).length
      ? Object.entries(comparison).map(([key, value]) =>
          '<div class="metric comparison-row"><span>' +
          safeText(comparisonLabel(key)) + '</span><div>' +
          renderComparisonValue(value) + '</div></div>'
        ).join("")
      : '<p class="muted">Sem dados de comparação disponíveis.</p>') +
    '</details>';
}

async function analyse(id) {
  $("analysis").innerHTML = '<p class="muted">A consultar estatísticas e previsões...</p>';

  try {
    const [statistics, predictions] = await Promise.all([
      api("/api/statistics?fixture=" + encodeURIComponent(id)),
      api("/api/predictions?fixture=" + encodeURIComponent(id))
    ]);

    const teams = Array.isArray(statistics.results) ? statistics.results : [];
    const predictionResults = Array.isArray(predictions.results) ? predictions.results : [];

    $("analysis").innerHTML =
      '<div class="analysis-section"><h3>Estatísticas do jogo</h3>' +
      (teams.length
        ? teams.map(renderTeamStatistics).join("")
        : '<p class="muted">As estatísticas ainda não estão disponíveis. Normalmente surgem durante ou após o jogo.</p>') +
      '</div><div class="analysis-section"><h3>Previsões</h3>' +
      renderPredictions(predictions) +
      '<p class="muted">As previsões são indicadores estatísticos, não garantias de resultado.</p></div>';
  } catch (error) {
    $("analysis").innerHTML = '<p>Não foi possível carregar a análise: ' +
      safeText(error.message) + '</p>';
  }
}

$("searchButton").addEventListener("click", loadFixtures);
document.querySelectorAll("[data-league-country], [data-league-name]").forEach(button => {
  button.addEventListener("click", () => selectQuickLeague(button));
});
loadLeagues();
</script>
