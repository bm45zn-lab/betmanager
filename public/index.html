<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetManager</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a18;color:#f1f5f3;font-family:Arial,sans-serif}
header{background:#163d30;padding:23px}
main{max-width:1000px;margin:auto;padding:18px}
h1{margin:0;color:#8ae0b4}
.card{background:#1b2925;border:1px solid #34443d;padding:17px;border-radius:13px;margin:14px 0}
input,select,button{padding:12px;border-radius:8px;border:1px solid #52645a;background:#263832;color:white;max-width:100%}
button{background:#159365;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.match{padding:13px;border-bottom:1px solid #34443d}
small{color:#aabbb2}
.green{color:#7ce1a9}
</style>
</head>
<body>
<header>
<h1>⚽ BETMANAGER</h1>
<p>Análise inteligente de futebol</p>
</header>
<main>
<div class="card">
<h2>Calendário de jogos</h2>
<div class="grid">
<label>Data inicial<br><input type="date" id="from"></label>
<label>Data final<br><input type="date" id="to"></label>
<label>Pesquisar liga por nome ou país<br>
<input type="search" id="leagueSearch" placeholder="Ex.: Premier League, Portugal..." autocomplete="off">
</label>
<label>Competição<br>
<select id="league">
<option value="">Todas as competições</option>
</select>
</label>
</div>
<br>
<button id="searchButton" type="button">Pesquisar jogos</button>
<p id="status"><small>Seleciona as datas para começar.</small></p>
</div>

<div class="card">
<h2>Jogos encontrados</h2>
<div id="games">Aguardando pesquisa...</div>
</div>

<div class="card">
<h2>Análise do jogo</h2>
<div id="analysis">Seleciona um jogo para consultar as estatísticas.</div>
</div>
</main>
<script>
"use strict";

const $ = id => document.getElementById(id);

// Formata a data no fuso local sem depender de toLocaleDateString.
function localDateInputValue(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}

const today = localDateInputValue();
$("from").value = today;
$("to").value = today;

let leagues = [];

async function api(path) {
  const response = await fetch(path);
  const text = await response.text();
  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    throw new Error("O servidor devolveu uma resposta inválida (" + response.status + ").");
  }

  if (!response.ok) {
    const detail = data.details ? ": " + JSON.stringify(data.details) : "";
    throw new Error((data.error || "Erro HTTP " + response.status) + detail);
  }

  return data;
}

function renderLeagueOptions() {
  const select = $("league");
  const search = $("leagueSearch").value.trim().toLocaleLowerCase("pt-PT");
  const previousValue = select.value;
  const filtered = leagues.filter(league => {
    const label = (String(league.name || "") + " " + String(league.country || ""))
      .toLocaleLowerCase("pt-PT");
    return label.includes(search);
  });

  select.replaceChildren();
  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = search ? "Todas as competições (limpar pesquisa)" : "Todas as competições";
  select.appendChild(allOption);

  filtered.forEach(league => {
    const option = document.createElement("option");
    option.value = String(league.id);
    option.dataset.season = String(league.season || 2026);
    option.textContent = (league.name || "Competição") + " — " + (league.country || "");
    select.appendChild(option);
  });

  if (filtered.some(league => String(league.id) === previousValue)) {
    select.value = previousValue;
  }
}

async function loadLeagues() {
  const select = $("league");
  select.innerHTML = '<option value="">A carregar ligas...</option>';

  try {
    const data = await api("/api/leagues?season=2026");
    leagues = Array.isArray(data.results) ? data.results : [];
    renderLeagueOptions();
    if (!leagues.length) {
      $("status").textContent = "Não foram encontradas ligas para a época carregada.";
    }
  } catch (error) {
    select.innerHTML = '<option value="">Ligas indisponíveis</option>';
    $("status").textContent = "Não foi possível carregar as ligas: " + error.message;
  }
}

async function loadFixtures() {
  const from = $("from").value;
  const to = $("to").value;
  const select = $("league");
  const league = select.value;
  const season = select.selectedOptions[0]?.dataset.season;
  const button = $("searchButton");

  if (!from || !to || from > to) {
    $("status").textContent = "Verifica as datas: a data inicial deve ser anterior ou igual à data final.";
    return;
  }

  button.disabled = true;
  button.textContent = "A pesquisar...";
  $("status").textContent = "A consultar jogos...";
  $("games").textContent = "A carregar...";

  try {
    const query = new URLSearchParams({ from, to });
    if (league) {
      query.set("league", league);
      query.set("season", season || "2026");
    }

    const data = await api("/api/fixtures?" + query.toString());
    const games = Array.isArray(data.results) ? data.results : [];

    $("status").textContent = games.length + " jogos encontrados";
    $("games").innerHTML = games.length
      ? games.map(game => {
          const fixtureId = Number(game.fixture?.id);
          const home = game.teams?.home?.name || "Equipa da casa";
          const away = game.teams?.away?.name || "Equipa visitante";
          const leagueName = game.league?.name || "Competição";
          const date = game.fixture?.date ? new Date(game.fixture.date).toLocaleString("pt-PT") : "Data indisponível";
          return '<div class="match"><b>' + home + " – " + away + '</b>' +
            "<p><small>" + leagueName + " · " + date + "</small></p>" +
            (Number.isFinite(fixtureId) ? '<button type="button" onclick="analyse(' + fixtureId + ')">Analisar jogo</button>' : "") +
            "</div>";
        }).join("")
      : "Não foram encontrados jogos para estas datas.";
  } catch (error) {
    $("status").textContent = "Erro ao pesquisar: " + error.message;
    $("games").textContent = "Não foi possível carregar os jogos. Confirma a ligação e tenta novamente.";
  } finally {
    button.disabled = false;
    button.textContent = "Pesquisar jogos";
  }
}

async function analyse(id) {
  $("analysis").textContent = "A consultar estatísticas...";

  try {
    const [statistics, predictions] = await Promise.all([
      api("/api/statistics?fixture=" + encodeURIComponent(id)),
      api("/api/predictions?fixture=" + encodeURIComponent(id))
    ]);

    $("analysis").innerHTML =
      "<h3>Estatísticas</h3>" +
      (statistics.results || []).map(team =>
        "<h4>" + (team.team?.name || "Equipa") + "</h4>" +
        (team.statistics || []).map(item =>
          "<p>" + item.type + ': <b>' + (item.value ?? "N/D") + "</b></p>"
        ).join("")
      ).join("") +
      "<h3>Previsões do fornecedor</h3><pre></pre>";

    $("analysis").querySelector("pre").textContent =
      JSON.stringify(predictions.results, null, 2);
  } catch (error) {
    $("analysis").textContent = "Erro ao analisar o jogo: " + error.message;
  }
}

$("searchButton").addEventListener("click", loadFixtures);
$("leagueSearch").addEventListener("input", renderLeagueOptions);
loadLeagues();
</script>
</body>
</html>
