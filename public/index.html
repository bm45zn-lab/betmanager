
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetManager</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a18;color:#f1f5f3;font-family:Arial,sans-serif}
header{background:#163d30;padding:23px}
main{max-width:1000px;margin:auto;padding:18px}
h1{margin:0;color:#8ae0b4}
.card{background:#1b2925;border:1px solid #34443d;padding:17px;border-radius:13px;margin:14px 0}
input,select,button{padding:12px;border-radius:8px;border:1px solid #52645a;background:#263832;color:white;max-width:100%}
button{background:#159365;border:0;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.match{padding:13px;border-bottom:1px solid #34443d}
small{color:#aabbb2}
.green{color:#7ce1a9}
</style>
</head>
<body>
<header>
<h1>⚽ BETMANAGER</h1>
<p>Análise inteligente de futebol</p>
</header>
<main>
<div class="card">
<h2>Calendário de jogos</h2>
<div class="grid">
<label>Data inicial<br><input type="date" id="from"></label>
<label>Data final<br><input type="date" id="to"></label>
<label>Competição<br>
<select id="league">
<option value="">Todas as competições</option>
</select>
</label>
</div>
<br>
<button onclick="loadFixtures()">Pesquisar jogos</button>
<p id="status"><small>Seleciona as datas para começar.</small></p>
</div>

<div class="card">
<h2>Jogos encontrados</h2>
<div id="games">Aguardando pesquisa...</div>
</div>

<div class="card">
<h2>Análise do jogo</h2>
<div id="analysis">Seleciona um jogo para consultar as estatísticas.</div>
</div>
</main>
<script>

const $ = id => document.getElementById(id);

const today = new Date().toLocaleDateString("en-CA");
$("from").value = today;
$("to").value = today;

let leagues = [];

async function api(path) {
  const r = await fetch(path);
  const d = await r.json();

  if (!r.ok) {
    throw Error(
      d.error + (d.details
        ? ": " + JSON.stringify(d.details)
        : "")
    );
  }

  return d;
}

async function loadLeagues() {
  const select = $("league");
  select.innerHTML = '<option value="">A carregar ligas...</option>';

  try {
    const data = await api("/api/leagues?season=2026");
    leagues = data.results || [];

    select.innerHTML =
      '<option value="">Todas as competições</option>' +
      leagues.map(l =>
        `<option value="${l.id}" data-season="${l.season}">
          ${l.name} — ${l.country}
        </option>`
      ).join("");

  } catch (e) {
    select.innerHTML = '<option value="">Erro ao carregar ligas</option>';
    $("status").textContent = e.message;
  }
}

async function loadFixtures() {
  const from = $("from").value;
  const to = $("to").value;
  const select = $("league");
  const league = select.value;
  const season = select.selectedOptions[0]?.dataset.season;

  if (!from || !to || from > to) {
    return alert("Verifica as datas.");
  }

  $("status").textContent = "A consultar jogos...";
  $("games").textContent = "A carregar...";

  try {
    const q = new URLSearchParams({ from, to });

    if (league) {
      q.set("league", league);
      q.set("season", season || "2026");
    }

    const data = await api("/api/fixtures?" + q);
    const games = data.results || [];

    $("status").textContent =
      games.length + " jogos encontrados";

    $("games").innerHTML = games.length
      ? games.map(g => `
        <div class="match">
          <b>${g.teams.home.name} – ${g.teams.away.name}</b>
          <p><small>${g.league.name} · ${new Date(g.fixture.date).toLocaleString("pt-PT")}</small></p>
          <button onclick="analyse(${g.fixture.id})">
            Analisar jogo
          </button>
        </div>
      `).join("")
      : "Não foram encontrados jogos.";

  } catch (e) {
    $("status").textContent = e.message;
    $("games").textContent = "Erro ao carregar jogos.";
  }
}

async function analyse(id) {
  $("analysis").textContent = "A consultar estatísticas...";

  try {
    const [s, p] = await Promise.all([
      api("/api/statistics?fixture=" + id),
      api("/api/predictions?fixture=" + id)
    ]);

    $("analysis").innerHTML =
      "<h3>Estatísticas</h3>" +
      (s.results || []).map(team =>
        `<h4>${team.team.name}</h4>` +
        (team.statistics || []).map(x =>
          `<p>${x.type}: <b>${x.value ?? "N/D"}</b></p>`
        ).join("")
      ).join("") +
      "<h3>Previsões do fornecedor</h3><pre></pre>";

    $("analysis").querySelector("pre").textContent =
      JSON.stringify(p.results, null, 2);

  } catch (e) {
    $("analysis").textContent = e.message;
  }
}

loadLeagues();

</body>
</html>
